name: Preview Planning Regression Gate

on:
  push:
    branches:
      - preview/docentedigital-fase10-20261030
      - preview/motor-pedagogico-v2-derechos-2do-20261112
      - feature/motor-pedagogico-v3-integral-20261112
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-planning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planning-regressions:
    name: Curriculum, unit semantics and Word checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact preview commit
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --version
          find . -maxdepth 1 -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          find tests -maxdepth 1 -type f -name '*.mjs' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Verify teacher request routing, topic extraction and subject filtering
        shell: bash
        run: |
          set -euo pipefail
          node tests/quick-request-routing-phase11.mjs
          node tests/teacher-intent-boundary-v12.mjs
          node tests/unit-explicit-areas-and-situation-v13.mjs
          node tests/creative-situation-sanitization-v13.mjs
          node tests/planning-structured-request-v14.mjs
          node tests/structured-water-regression-v15.mjs
          node tests/planning-topic-realization-v17.mjs
          node tests/sixth-grade-coherence-v18.mjs

      - name: Verify Word, progression and all-level curriculum constraints
        shell: bash
        run: |
          set -euo pipefail
          node tests/unit-export-quality-phase11.mjs
          node tests/primary-activity-criteria-v19.mjs
          node tests/unit-topic-curriculum-coherence-v20.mjs
          node tests/teacher-explicit-fields-v21.mjs
          node tests/short-rights-unit-v22.mjs
          node tests/assisted-context-grounding-v25.mjs
          node tests/product-selection-priority-v23.mjs
          node tests/product-canonical-contract-v36.mjs
          node tests/approved-selection-storage-v37.mjs
          node tests/unit-export-product-consistency-v24.mjs
          node tests/instrument-descriptors-v27.mjs
          node tests/instrument-ui-word-parity-v28.mjs
          node tests/unit-persistence-draft-preservation-v29.mjs
          node tests/unit-sequence-day-criteria-v30.mjs
          node tests/science-rights-inquiry-v31.mjs
          node tests/rights-expert-override-guard-v33.mjs
          node tests/rights-finalize-situation-v34.mjs
          node tests/short-rights-options-v35.mjs
          node tests/regression-contract-v20.mjs
          node tests/planning-chain-integrity.mjs
          node tests/unit-semantic-guardrails-v26.mjs
          node tests/planning-semantic-coherence-v16.mjs
          node tests/docx-xml-safety.mjs
          node tests/context-topic-golden.mjs
          node tests/three-level-pedagogy.mjs
          node tests/primary-math-moments-v38.mjs
          node tests/primary-math-final-sequence-v39.mjs
          node tests/individual-session-rubric-v40.mjs
          node tests/second-grade-upload-regressions-v42.mjs
          node tests/primary-communication-curriculum.mjs
          node tests/primary-mathematics-curriculum.mjs
          node tests/primary-science-curriculum.mjs
          node tests/primary-personal-social-curriculum.mjs

      - name: GPT Preview safety checks (mocked, never billable)
        shell: bash
        run: |
          set -euo pipefail
          node --check api/ai.js
          node --check api/image.js
          node --check api/ai-status.js
          node --check api/ai-preflight.js
          node --check api/ai-quota-write-preflight.js
          node tests/ai-preview-lock-v43.mjs
          node tests/plus-demo-no-api-v44.mjs
          node tests/inline-review-v46.mjs
          node tests/inline-review-ui-v47.mjs
          node tests/teacher-approved-session-fields-v48.mjs
          node tests/pedagogical-v2-contract.mjs
          node tests/planning-engine-v3-core.mjs
          node tests/planning-engine-v3-v2-compat.mjs
          node tests/planning-engine-v3-water-case.mjs
          node tests/planning-engine-v3-integration.mjs
          node tests/ai-contract.mjs
          node tests/ai-preflight.mjs
          node tests/ai-quota-write-preflight.mjs
          node tests/ai-beta-client.mjs

      - name: Make no production release
        shell: bash
        run: |
          printf '%s\n' 'Preview-only CI checks. No deployment/promotion, DB changes, or secrets required.'
