name: Beta E2E Browser Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static app
        run: |
          python3 -m http.server 4173 >/tmp/docentedigital-http.log 2>&1 &
          echo $! > /tmp/docentedigital-http.pid
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null

      - name: Isolate mobile touch regression
        timeout-minutes: 2
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/mobile-isolation.mjs

      - name: Test actual Android-style taps across all three levels
        timeout-minutes: 3
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/mobile-onboarding-e2e.mjs

      - name: Upload mobile failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-onboarding-failure
          path: /tmp/dd-mobile-artifacts/*.png
          if-no-files-found: ignore

      - name: Run beta E2E browser gate
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/beta-e2e.mjs

      - name: Run semantic golden regressions
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/semantic-golden.mjs

      - name: Run network privacy gate
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/network-privacy.mjs

      - name: Run continuity and resilience gate
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/continuity-resilience.mjs

      - name: Validate DOCX internal OOXML structure
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/docx-structure.mjs

      - name: Run critical accessibility smoke
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/accessibility-smoke.mjs

      - name: Show static server log on failure
        if: failure()
        run: cat /tmp/docentedigital-http.log || true

      - name: Stop static app
        if: always()
        run: |
          if [ -f /tmp/docentedigital-http.pid ]; then
            kill "$(cat /tmp/docentedigital-http.pid)" || true
          fi
