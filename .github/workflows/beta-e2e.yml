name: Beta E2E Browser Gate

on:
  push:
    branches: [main, audit/v5-continuity-offline-diagnostic, preview/docentedigital-fase10-20261030, preview/motor-pedagogico-v2-derechos-2do-20261112]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-context-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate GPT API safety contract
        run: node tests/ai-contract.mjs

      - name: Validate school instruction privacy
        run: node tests/ai-privacy-pedagogy.mjs

      - name: Validate draft SQL profile privilege isolation (static)
        run: node tests/sql-profile-privilege-guard.mjs

      - name: Validate DOCX XML character safety (offline)
        run: node tests/docx-xml-safety.mjs

      - name: Validate Redis quota operation kinds and accounting (mock)
        run: node tests/ai-quota-kind.mjs

      - name: Validate protected non-billable Redis preflight
        run: node tests/ai-preflight.mjs

      - name: Validate explicit synthetic Redis quota write preflight
        run: node tests/ai-quota-write-preflight.mjs
      - name: Validate offline fallback
        run: node tests/ai-local-fallback.mjs
      - name: Validate context isolation and private beta token
        run: node tests/ai-beta-client.mjs

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          # Runner Ubuntu already supplies the system libraries; avoid apt DNS outages.
          npx playwright install chromium

      - name: Start static app
        run: |
          python3 -m http.server 4173 >/tmp/docentedigital-http.log 2>&1 &
          echo $! > /tmp/docentedigital-http.pid
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null

      - name: Validate GPT serverless API contract without real credentials
        run: node tests/ai-contract.mjs

      - name: Validate offline title fallback and truthful GPT connection status
        run: node tests/ai-local-fallback.mjs

      - name: Validate private beta client access token handling
        run: node tests/ai-beta-client.mjs

      - name: Validate manual ChatGPT Plus demo with actual buttons and DOCX
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/plus-demo-browser-v45.mjs

      - name: Upload manual Plus demo screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plus-demo-browser-failure
          path: /tmp/dd-plus-demo/*.png
          if-no-files-found: ignore

      - name: Test actual Android-style taps across all three levels
        timeout-minutes: 3
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/mobile-onboarding-e2e.mjs

      - name: Upload mobile failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-onboarding-failure
          path: /tmp/dd-mobile-artifacts/*.png
          if-no-files-found: ignore

      - name: Run beta E2E browser gate
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/beta-e2e.mjs

      - name: Verify 6th grade teacher intent survives browser and Word (permanent regression)
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/sixth-grade-browser-regression-v21.mjs

      - name: Upload sixth-grade regression failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sixth-grade-regression-failure
          path: /tmp/dd-sixth-regression/*.png
          if-no-files-found: ignore

      - name: Verify real unit correction, reload and Word in browser
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/inline-review-browser-v47.mjs

      - name: Upload correction editor screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inline-correction-failure
          path: /tmp/dd-inline-review/*.png
          if-no-files-found: ignore

      - name: Verify new pedagogical V2 unit, detailed session and Word
        if: github.ref == 'refs/heads/preview/motor-pedagogico-v2-derechos-2do-20261112'
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/pedagogical-v2-browser.mjs

      - name: Upload V2 regression screenshot on failure
        if: failure() && github.ref == 'refs/heads/preview/motor-pedagogico-v2-derechos-2do-20261112'
        uses: actions/upload-artifact@v4
        with:
          name: pedagogical-v2-browser-failure
          path: /tmp/dd-pedagogical-v2/*.png
          if-no-files-found: ignore

      - name: Test natural short rights request, expo product and second-grade DOCX
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/short-rights-browser-v22.mjs

      - name: Verify actual 6th-grade rights unit, 2 sessions per day, product and Word
        env:
          BASE_URL: http://127.0.0.1:4173
        run: |
          set -e
          node tests/rights-sixth-two-daily-browser-v32.mjs
          node tests/rights-sixth-two-daily-browser-v32.mjs
          node tests/rights-sixth-two-daily-browser-v32.mjs

      - name: Check actual mathematics session and Word pedagogical moments
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/math-session-five-moments-browser-v41.mjs

      - name: Upload mathematics session failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mathematics-session-failure
          path: /tmp/dd-math-session/*.png
          if-no-files-found: ignore

      - name: Upload sixth-grade rights failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rights-sixth-two-daily-failure
          path: /tmp/dd-rights-sixth/*.png
          if-no-files-found: ignore

      - name: Upload rights regression failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rights-regression-failure
          path: /tmp/dd-rights-regression/*.png
          if-no-files-found: ignore

      - name: Verify EIB multigrade materials, truthful language warning and DOCX
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/materials-eib-e2e.mjs

      - name: Run semantic golden regressions
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/semantic-golden.mjs

      - name: Run network privacy gate
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/network-privacy.mjs

      - name: Run continuity and resilience gate
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/continuity-resilience.mjs

      - name: Validate DOCX internal OOXML structure
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/docx-structure.mjs

      - name: Run critical accessibility smoke
        env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/accessibility-smoke.mjs

      - name: Show static server log on failure
        if: failure()
        run: cat /tmp/docentedigital-http.log || true

      - name: Stop static app
        if: always()
        run: |
          if [ -f /tmp/docentedigital-http.pid ]; then
            kill "$(cat /tmp/docentedigital-http.pid)" || true
          fi
