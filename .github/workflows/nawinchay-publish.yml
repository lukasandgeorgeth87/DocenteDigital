name: Build Ñawinchay mobile reading pilot

on:
  push:
    branches:
      - nawinchay-pilot-public
    paths:
      - .github/workflows/nawinchay-publish.yml

permissions:
  contents: write

jobs:
  build-mobile-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nawinchay-pilot-public

      - name: Download verified mobile reading upgrade
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://frhtvbcuaufeybpokomz.supabase.co"
          curl -fsSL "$BASE/functions/v1/nawinchay-js2-mobile-v4" -o nawinchay/js2.js
          curl -fsSL "$BASE/functions/v1/nawinchay-mobile-css-v4" -o nawinchay/mobile-v4.css
          curl -fsSL "$BASE/functions/v1/nawinchay-data" -o nawinchay/data/readings.json

      - name: Activate mobile stylesheet and fresh service worker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("nawinchay/index.html")
          s=p.read_text()
          link='<link rel="stylesheet" href="mobile-v4.css" />'
          if link not in s:
              s=s.replace('<link rel="stylesheet" href="styles.css" />','<link rel="stylesheet" href="styles.css" />\n  '+link)
          s=s.replace('manifest.webmanifest','manifest.json')
          p.write_text(s)
          PY

          cat > nawinchay/sw.js <<'EOF'
          const CACHE='nawinchay-mobile-v4';
          const ASSETS=['./','./index.html','./styles.css','./mobile-v4.css','./config.js','./js1.js','./js2.js','./js3.js','./js4.js','./data/readings.json','./manifest.json'];
          self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;const u=new URL(e.request.url);if(u.origin!==self.location.origin)return;e.respondWith(caches.match(e.request).then(hit=>hit||fetch(e.request).then(r=>{const copy=r.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));return r}).catch(()=>caches.match('./index.html'))));});
          EOF

      - name: Validate Ñawinchay mobile pilot
        shell: bash
        run: |
          set -euo pipefail
          test "$(python - <<'PY'
          import json
          print(len(json.load(open('nawinchay/data/readings.json'))))
          PY
          )" = "10"
          node --check nawinchay/js1.js
          node --check nawinchay/js2.js
          node --check nawinchay/js3.js
          node --check nawinchay/js4.js
          grep -q 'Comic Sans' nawinchay/mobile-v4.css
          grep -q 'Responder hablando' nawinchay/js2.js
          grep -q 'Escuchar pregunta' nawinchay/js2.js
          grep -q 'Kusi lee' nawinchay/js2.js
          python -m http.server 4173 -d nawinchay >/tmp/nawinchay-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 1
          for f in index.html styles.css mobile-v4.css config.js js1.js js2.js js3.js js4.js data/readings.json manifest.json sw.js; do
            curl -fsS "http://127.0.0.1:4173/$f" >/dev/null
          done

      - name: Commit isolated mobile upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nawinchay
          git diff --cached --quiet && exit 0
          git commit -m "feat: mobile first-grade read-along experience"
          git push origin nawinchay-pilot-public
