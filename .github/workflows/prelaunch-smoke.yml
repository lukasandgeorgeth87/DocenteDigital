name: Prelaunch Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify mandatory audit specifications
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/AUDITORIA_MAESTRA_INTEGRAL_V2.md
          test -f docs/ADENDA_AUDITORIA_EJECUTABLE_V3.md
          test -f docs/AUDITORIA_SIMPLICIDAD_USO_V4.md
          test -f docs/AUDITORIA_PRELANZAMIENTO_V5.md
          test -f docs/NUCLEO_IA_DOCENTEDIGITAL.md

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            node --check "$file"
          done

      - name: Verify planning redaction coherence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          proposal = Path('proposal-choice-v8.js').read_text(encoding='utf-8')
          coherence = Path('planning-coherence-v51.js').read_text(encoding='utf-8')

          # V4 + Núcleo IA: user-facing planning text must be natural and must not expose
          # internal analysis wording as if it were part of the pedagogical document.
          forbidden_surface = [
              'La descripción del docente plantea la siguiente necesidad o problema:',
              'La descripción reconoce además esta oportunidad o fortaleza:',
              '🧠 <b>Lectura experta:</b>',
              "Reto: ${reto}",
          ]
          found = [text for text in forbidden_surface if text in proposal]
          if found:
              raise SystemExit('Planning proposal exposes internal/meta wording: ' + ' | '.join(found))

          required = [
              "title:'Propuesta 1'",
              "title:'Propuesta 2'",
              'no añaden causas, problemas o finalidades que no estén sustentados',
              'polishSituationText',
          ]
          missing = [text for text in required if text not in proposal + coherence]
          if missing:
              raise SystemExit('Planning coherence safeguards missing: ' + ' | '.join(missing))

          # Known regression: a simple observation of ants in the classroom must not
          # fabricate specific questions such as why they are there or how they live.
          known_inventions = ['por qué están allí', 'cómo viven y qué características tienen']
          leaked = [text for text in known_inventions if text in coherence]
          if leaked:
              raise SystemExit('Known classroom-ant regression reintroduced: ' + ' | '.join(leaked))

          print('Planning redaction coherence checks passed.')
          PY

      - name: Reject unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then
            echo 'Unresolved merge conflict markers found.' >&2
            exit 1
          fi

      - name: Verify production entry files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s storage-recovery-v26.js
          test -s config-state-guard-v42.js
          test -s curriculum-safety-v27.js
          test -s docx-export-v29.js

      - name: Verify Beta tools are wired but production launch stays blocked
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          html = Path('index.html').read_text(encoding='utf-8')
          manifest = json.loads(Path('release-beta-2026-09-24.json').read_text(encoding='utf-8'))
          if manifest.get('productionApproved') is not False:
              raise SystemExit('Safety violation: Beta manifest approved production.')
          blockers = set(manifest.get('notProductionReady', []))
          required_blockers = {
              'authentication_backend', 'multiuser_tenant_isolation',
              'cloud_sync_and_server_backup', 'remote_generative_ai'
          }
          if not required_blockers.issubset(blockers):
              raise SystemExit('Production blockers disappeared without security evidence.')

          actions = {
              'data-screen="materials"': 'materials-v1.js',
              'data-screen="evaluation"': 'evaluation-v1.js',
              'window.DDPlanningTools?.openDiagnostic()': 'planning-tools-v1.js',
              'window.DDPlanningTools?.openAnnual()': 'planning-tools-v1.js'
          }
          missing = [f'{control} -> {module}' for control, module in actions.items()
                     if control not in html or f'src="{module}"' not in html]
          if missing:
              raise SystemExit('Beta actions missing or not wired: ' + ', '.join(missing))

          for module in ['materials-v1.js','evaluation-v1.js','planning-tools-v1.js','director-v1.js','setup-native-v2.js']:
              if not Path(module).is_file():
                  raise SystemExit('Missing active Beta module: ' + module)

          onboarding = Path('onboarding.html')
          if not onboarding.is_file():
              raise SystemExit('Mobile onboarding page missing.')
          source = onboarding.read_text(encoding='utf-8')
          for element in ('name="ddLevel"', 'name="ddIE"', 'ddSetupNativeForm', 'data-dd-grade-group="Inicial"', 'data-dd-area-group="Secundaria"'):
              if element not in source:
                  raise SystemExit('Mobile onboarding missing: ' + element)
          if '<script src=' in source:
              raise SystemExit('Isolated onboarding unexpectedly loads application modules.')
          if 'First-run gate: keep heavy planning modules' not in html:
              raise SystemExit('Index must redirect incomplete setup before heavy modules.')
          if html.index('First-run gate: keep heavy planning modules') > html.index('src="app.js"'):
              raise SystemExit('Mobile onboarding routing must run before the heavy application.')
          initial = source.split('data-dd-area-group="Inicial"')[1].split('</fieldset>')[0]
          if 'Arte y Cultura' in initial:
              raise SystemExit('Initial offers Arte y Cultura as a separate area.')

          print('Beta features wired. Production still blocked by explicit backend/privacy gates.')
          PY

      - name: Verify local assets referenced by production HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          class AssetParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.assets = []

              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag == 'script' and data.get('src'):
                      self.assets.append(data['src'])
                  if tag == 'link' and data.get('href') and 'stylesheet' in (data.get('rel') or ''):
                      self.assets.append(data['href'])

          parser = AssetParser()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          missing = []
          for asset in parser.assets:
              parsed = urlparse(asset)
              if parsed.scheme or parsed.netloc or asset.startswith('//'):
                  continue
              local = parsed.path.lstrip('/')
              if not local or not Path(local).is_file():
                  missing.append(asset)
          if missing:
              raise SystemExit('Missing local assets referenced by index.html: ' + ', '.join(missing))
          print(f'Validated {len(parser.assets)} local/external asset references from index.html.')
          PY

      - name: Verify audited critical runtime modules are wired to production
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # A module existing in GitHub is not evidence that production executes it.
          # Count a module as wired only if it is referenced by a production entrypoint
          # or by one of the runtime loaders that the entrypoint itself loads.
          wiring_files = [
              Path('index.html'),
              Path('initial-curriculum-guard-v72.js'),
              Path('schedule-prompt-v6.js'),
          ]
          runtime_wiring = '\n'.join(
              path.read_text(encoding='utf-8') for path in wiring_files if path.is_file()
          )

          # V3/V5: protect the runtime wiring of modules whose absence could make
          # a critical feature look present while its guard/export/persistence is not active.
          required = [
              'config-state-guard-v42.js',
              'linguistic-profile-v26.js',
              'linguistic-confirmation-v37.js',
              'institution-master-v46.js',
              'title-context-v38.js',
              'significant-situation-core-v53.js',
              'role-surface-guard-v68.js',
              'persistence-truth-v63.js',
              'curriculum-safety-v27.js',
              'docx-export-v29.js',
              'material-integrity-v65.js',
              'runtime-audit-v23.js',
              'prelaunch-evidence-gate-v50.js',
              'simplicity-audit-v49.js',
          ]

          missing_files = [name for name in required if not Path(name).is_file()]
          unwired = [name for name in required if name not in runtime_wiring]
          if missing_files:
              raise SystemExit('Audited critical runtime modules missing from repository: ' + ', '.join(missing_files))
          if unwired:
              raise SystemExit('Audited critical runtime modules exist but are NOT wired to production: ' + ', '.join(unwired))
          print('Audited critical runtime modules are wired to the production runtime loaders.')
          PY

      - name: V5 scope notice
        run: |
          echo 'This workflow is only a technical smoke gate.'
          echo 'It does not validate physical mobile devices, real Word/PDF printing, users, backend, OWASP ASVS, restore drills, semantic AI, concurrency, or pilots.'