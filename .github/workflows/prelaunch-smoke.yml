name: Prelaunch Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify mandatory audit specifications
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/AUDITORIA_MAESTRA_INTEGRAL_V2.md
          test -f docs/ADENDA_AUDITORIA_EJECUTABLE_V3.md
          test -f docs/AUDITORIA_SIMPLICIDAD_USO_V4.md
          test -f docs/AUDITORIA_PRELANZAMIENTO_V5.md
          test -f docs/NUCLEO_IA_DOCENTEDIGITAL.md

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            node --check "$file"
          done

      - name: Reject unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then
            echo 'Unresolved merge conflict markers found.' >&2
            exit 1
          fi

      - name: Verify production entry files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s storage-recovery-v26.js
          test -s config-state-guard-v42.js
          test -s curriculum-safety-v27.js
          test -s docx-export-v29.js

      - name: Verify local assets referenced by production HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          class AssetParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.assets = []

              def handle_starttag(self, tag, attrs):
                  data = dict(attrs)
                  if tag == 'script' and data.get('src'):
                      self.assets.append(data['src'])
                  if tag == 'link' and data.get('href') and 'stylesheet' in (data.get('rel') or ''):
                      self.assets.append(data['href'])

          parser = AssetParser()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          missing = []
          for asset in parser.assets:
              parsed = urlparse(asset)
              if parsed.scheme or parsed.netloc or asset.startswith('//'):
                  continue
              local = parsed.path.lstrip('/')
              if not local or not Path(local).is_file():
                  missing.append(asset)
          if missing:
              raise SystemExit('Missing local assets referenced by index.html: ' + ', '.join(missing))
          print(f'Validated {len(parser.assets)} local/external asset references from index.html.')
          PY

      - name: Verify audited critical runtime modules are wired to production
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # A module existing in GitHub is not evidence that production executes it.
          # Count a module as wired only if it is referenced by index.html or by the
          # bootstrap guard that dynamically loads critical modules.
          index = Path('index.html').read_text(encoding='utf-8')
          bootstrap_path = Path('initial-curriculum-guard-v72.js')
          bootstrap = bootstrap_path.read_text(encoding='utf-8') if bootstrap_path.is_file() else ''
          runtime_wiring = index + '\n' + bootstrap

          required = [
              'title-context-v38.js',
              'significant-situation-core-v53.js',
              'institution-master-v46.js',
              'runtime-audit-v23.js',
              'simplicity-audit-v49.js',
          ]

          missing_files = [name for name in required if not Path(name).is_file()]
          unwired = [name for name in required if name not in runtime_wiring]
          if missing_files:
              raise SystemExit('Audited critical runtime modules missing from repository: ' + ', '.join(missing_files))
          if unwired:
              raise SystemExit('Audited critical runtime modules exist but are NOT wired to production: ' + ', '.join(unwired))
          print('Audited critical runtime modules are wired to the production bootstrap.')
          PY

      - name: V5 scope notice
        run: |
          echo 'This workflow is only a technical smoke gate.'
          echo 'It does not validate physical mobile devices, real Word/PDF printing, users, backend, OWASP ASVS, restore drills, semantic AI, concurrency, or pilots.'